# Runs the release checks, the tests, and the nukadoko scenario on every
# push to main or queue and on every pull request.
# Boundary: reads only. It publishes nothing; publish.yml does that for a version bump on main.
name: CI

on:
  push:
    branches: [main, queue]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # Installs from the lockfile only, as publish.yml does.
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:scenarios
